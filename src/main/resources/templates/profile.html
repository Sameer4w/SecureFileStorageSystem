<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Profile</title>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>
<div th:replace="~{navbar :: navbar}"></div>

<div class="full-container fade-in">

    <h1>👤 My Profile</h1>

    <div class="card profile-card">

        <div class="profile-header">

            <div class="profile-avatar">

                <span th:text="${#strings.substring(user.fullName,0,1)}">
                    A
                </span>

            </div>

            <h2 th:text="${user.fullName}">
                User Name
            </h2>

            <p class="profile-role">
                Secure File Storage User
            </p>

        </div>

        <hr class="profile-divider">

        <table>

            <tr>

                <th class="profile-field">
                    Field
                </th>

                <th>
                    Information
                </th>

            </tr>

            <tr>

                <td>
                    👤 Full Name
                </td>

                <td th:text="${user.fullName}">
                </td>

            </tr>

            <tr>

                <td>
                    📧 Email
                </td>

                <td th:text="${user.email}">
                </td>

            </tr>

            <tr>

                <td>
                    🔒 Account Status
                </td>

                <td class="status-active">

                    Active

                </td>

            </tr>

        </table>

        <br>

        <div class="text-center">

            <a href="/dashboard">

                <button>

                    🏠 Dashboard

                </button>

            </a>

            &nbsp;

            <a href="/files">

                <button class="btn-files">

                    📁 My Files

                </button>

            </a>

        </div>

    </div>

</div>
<script src="/js/theme.js"></script>
</body>

</html>
